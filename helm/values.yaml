# Default values for the gnis chart.

nameOverride: ""
fullnameOverride: ""

# Public hostname of the deployment. Referenced by the ingress and, via tpl,
# by env values below.
host: stage.gnis-ld.org

replicaCount: 1

# GHCR packages are private by default when first pushed. Either make the
# packages public on GitHub, or create a registry secret and list it here:
#   kubectl create secret docker-registry ghcr-pull -n gnis \
#     --docker-server=ghcr.io --docker-username=<gh-user> --docker-password=<PAT with read:packages>
# imagePullSecrets:
#   - name: ghcr-pull
imagePullSecrets: []

# One image serves both workloads: the GraphDB deployment runs it with the
# image's default entrypoint (GraphDB only), and the ETL CronJob runs
# etl.py from the same image. Built by usgs-triplifier's publish workflow.
image:
  repository: ghcr.io/dataoneorg/gnis-graphdb
  tag: latest
  pullPolicy: IfNotPresent

# GraphDB holds an exclusive lock on its storage volume; never let two pods
# overlap on it.
strategy:
  type: Recreate

graphdb:
  port: 7200
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6
  # Serving needs far less memory than the ETL: GraphDB idles ~1-2Gi with the
  # full dataset loaded.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 6Gi

# The ETL (download -> triplify -> import) runs as a CronJob against the
# GraphDB service, sharing the PVC for the import directory. Trigger the
# first load manually after install:
#   kubectl -n <ns> create job --from=cronjob/<release>-etl initial-load
etl:
  enabled: true
  # First day of every third month at midnight
  schedule: "0 0 1 */3 *"
  # Set false to skip the multi-GB download and reuse data already on the PVC
  downloadData: true
  # GraphDB admin password. Required unless existingSecret names a secret
  # with a 'gdb-pass' key.
  gdbPassword: ""
  existingSecret: ""
  env:
    LOD_BASE: "http://{{ .Values.host }}/lod"
    GEO_BASE: "http://{{ .Values.host }}/geometry"
    GNIS_INPUT_DIRECTORY: "/app/data/geographic_names"
    RDF_OUTPUT_DIRECTORY: "/app/data/output/gnis"
    GRAPHDB_IMPORT_DIRECTORY: "/root/graphdb-import"
    # Location to write archives to
    ARCHIVE_OUTPUT_DIRECTORY: "/app/archive"
    # Public base for release download URLs in the dataset metadata
    SITE_BASE: "https://{{ .Values.host }}"
    GDB_USER: "admin"
    GDB_DEFAULT_PASS: "root"
  backoffLimit: 2
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      memory: 20Gi

persistence:
  enabled: true
  # Set to reuse a PVC created outside the chart; leaves PV/PVC creation off.
  existingClaim: ""
  storage: 75Gi
  # Must be RWX (e.g. CephFS) when the ETL job can land on a different node
  # than GraphDB; RWO works on single-node clusters (minikube).
  accessModes:
    - ReadWriteMany
  # Static CephFS PersistentVolume. Creating a PV is a cluster-admin
  # operation; disable this and set existingClaim (or pre-create the PVC) if
  # you are not installing as an admin.
  pv:
    enabled: true
    csi:
      driver: cephfs.csi.ceph.com
      nodeStageSecretRef:
        name: csi-cephfs-gnis-secret
        namespace: ceph-csi-cephfs
      volumeAttributes:
        clusterID: "8aa4d4a0-a209-11ea-baf5-ffc787bfc812"
        fsName: "cephfs"
        staticVolume: "true"
        rootPath: /volumes/k8s-dev-gnis-subvol-group/k8s-dev-gnis-subvol/30037f7e-314f-41d8-ad0a-b1ea4c838a34
    reclaimPolicy: Retain

service:
  type: ClusterIP
  port: 80
  # GraphDB serves the SPARQL endpoint and Workbench directly; the Node.js
  # webapp was retired with the Python rewrite of the triplifier.
  targetPort: 7200
  sessionAffinity: ClientIP
  sessionAffinityTimeoutSeconds: 10800

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "$http_origin"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: ingress-nginx-tls-cert
