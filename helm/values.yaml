# Default values for the gnis chart.

nameOverride: ""
fullnameOverride: ""

# Public hostname of the deployment. Every minted URI (LOD_BASE, GEO_BASE)
# and public link derives from this, so a staging install must override it
# (e.g. --set host=stage.gnis-ld.org) before its first ETL run.
host: gnis-ld.org

replicaCount: 1

imagePullSecrets: []

image:
  repository: ghcr.io/dataoneorg/gnis-graphdb
  tag: latest
  pullPolicy: Always
strategy:
  type: Recreate
graphdb:
  port: 7200
  # After an unclean shutdown GraphDB replays its transaction journal, which
  # can take minutes on a multi-gigabyte repository. The generous
  # failureThreshold keeps the pod  unready (no traffic) for the whole
  # recovery. Do NOT add a liveness probe here without a matching startup
  # allowance: it would kill the pod mid-recovery and loop it.
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30
  heapSize: 4g
  # Serving needs far less memory than the ETL: GraphDB idles ~1-2Gi with the
  # full dataset loaded.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 6Gi

# The ETL (download -> triplify -> import) runs as a CronJob against the
# GraphDB service, sharing the PVC for the import directory. Each run first
# builds the legacy release when PUBLISH_LEGACY_RELEASE is true and its
# release file is missing from the archive volume.
etl:
  enabled: true
  # First day of every third month at midnight
  schedule: "0 0 1 */3 *"
  # Run the ETL once when the chart is installed, as a post-install hook.
  # helm install waits for it, so pass --timeout 3h.
  loadOnInstall: true
  # Set false to skip the remote data download and reuse data already on the PVC
  downloadData: true
  # GraphDB admin password. Required unless existingSecret names a secret
  # with a 'gdb-pass' key.
  gdbPassword: ""
  existingSecret: ""
  env:
    LOD_BASE: "http://{{ .Values.host }}/lod"
    GEO_BASE: "http://{{ .Values.host }}/geometry"
    GNIS_INPUT_DIRECTORY: "/app/data/geographic_names"
    RDF_OUTPUT_DIRECTORY: "/app/data/output/gnis"
    GRAPHDB_IMPORT_DIRECTORY: "/root/graphdb-import"
    # Location to write archives to
    ARCHIVE_OUTPUT_DIRECTORY: "/app/archive"
    # Public base for release download URLs in the dataset metadata
    SITE_BASE: "https://{{ .Values.host }}"
    # Whether USGS's final legacy dump, from 2021-08-25, is published as
    # release 210825. Features dropped by USGS since then are retained from it.
    PUBLISH_LEGACY_RELEASE: "true"
    GDB_USER: "admin"
    GDB_DEFAULT_PASS: "root"
  backoffLimit: 2
  # Time limit of one ETL Job in seconds, across all of its retries. A Job
  # past the limit is failed and its pod stopped. Without a limit, a run
  # that hangs stops every later scheduled run, because the CronJob's
  # concurrencyPolicy is Forbid.
  activeDeadlineSeconds: 21600
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 10Gi

persistence:
  enabled: true
  # Set to reuse a PVC created outside the chart.
  existingClaim: ""
  storage: 75Gi
  # Must be RWX (e.g. CephFS) when the ETL job can land on a different node
  # than GraphDB; RWO works on single-node clusters (minikube).
  accessModes:
    - ReadWriteMany
  # StorageClass for a dynamically provisioned claim, used when pv.enabled
  # is false. Empty means the cluster default.
  storageClassName: ""
  # Static CephFS PersistentVolume. The csi values identify one cluster's
  # filesystem and one subvolume. A second install of the chart on the same
  # cluster needs its own rootPath, or both installs share one GraphDB home
  # directory.
  pv:
    enabled: true
    csi:
      driver: cephfs.csi.ceph.com
      nodeStageSecretRef:
        name: csi-cephfs-gnis-secret
        namespace: ceph-csi-cephfs
      volumeAttributes:
        clusterID: "8aa4d4a0-a209-11ea-baf5-ffc787bfc812"
        fsName: "cephfs"
        staticVolume: "true"
        rootPath: /volumes/k8s-dev-gnis-subvol-group/k8s-dev-gnis-subvol/30037f7e-314f-41d8-ad0a-b1ea4c838a34
    reclaimPolicy: Retain

  # The published release archive is stored on its own volume. Everything on the
  # main volume above can be rebuilt by re-running the ETL, but the archived
  # dumps are the system of record for retention and lineage and cannot be
  # regenerated when source data is deleted. Keeping them apart means the
  # main volume can be wiped or resized freely, and the backup policy only has to cover
  # this claim. existingClaim is a claim created outside the chart. storageClassName must be a
  # ReadWriteMany class whose reclaimPolicy is Retain, so the archive is
  # kept when the claim is deleted. pv.enabled needs a dedicated subvolume
  # rootPath. The chart refuses to render with none of them set, because
  # the cluster default class may provision a volume that is deleted with
  # the claim or that cannot be mounted by two pods.
  archives:
    existingClaim: ""
    storageClassName: ""
    storage: 25Gi
    accessModes:
      - ReadWriteMany
    pv:
      enabled: false
      csi:
        driver: cephfs.csi.ceph.com
        nodeStageSecretRef:
          name: csi-cephfs-gnis-secret
          namespace: ceph-csi-cephfs
        volumeAttributes:
          clusterID: "8aa4d4a0-a209-11ea-baf5-ffc787bfc812"
          fsName: "cephfs"
          staticVolume: "true"
          rootPath: ""
      reclaimPolicy: Retain

# gnis-ld.org
webapp:
  replicaCount: 1
  image:
    repository: ghcr.io/dataoneorg/gnis-ld
    tag: latest
    pullPolicy: Always
  # The Express server's listen port.
  port: 3006
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# GraphDB
service:
  type: ClusterIP
  port: 80
  targetPort: 7200
  sessionAffinity: ClientIP
  sessionAffinityTimeoutSeconds: 10800

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "$http_origin"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: ingress-nginx-tls-cert
