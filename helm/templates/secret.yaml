{{- if and .Values.etl.enabled (not .Values.etl.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gnis.fullname" . }}
  labels:
    {{- include "gnis.labels" . | nindent 4 }}
type: Opaque
stringData:
  gdb-pass: {{ required "Set etl.gdbPassword (or etl.existingSecret) to the GraphDB admin password" .Values.etl.gdbPassword | quote }}
{{- end }}
