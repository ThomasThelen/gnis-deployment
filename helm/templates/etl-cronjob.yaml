{{- if .Values.etl.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "gnis.fullname" . }}-etl
  labels:
    {{- include "gnis.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.etl.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.etl.backoffLimit }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "gnis.name" . }}-etl
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          {{- include "gnis.etlPodSpec" . | trim | nindent 10 }}
{{- end }}
